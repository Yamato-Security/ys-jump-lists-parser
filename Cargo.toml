[package]
name = "ys-jump-lists"
version = "0.1.0"
# Yamato Security's jump list parser, from Sootmark/shell's jump list and compound file code:
# not published.
publish = false
edition = "2021"
# 1.88 with the codepages feature (encoding_rs).
rust-version = "1.80"
description = "Windows jump lists (automaticDestinations-ms and customDestinations-ms): every DestList version, property stores, links, custom categories and application names; damage reported, never a panic."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yamato-Security/ys-jump-lists-parser"
homepage = "https://github.com/Yamato-Security/ys-jump-lists-parser"
keywords = ["forensics", "dfir", "jumplist", "lnk", "windows"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "jumplist"

[features]
default = ["guid-names"]
# Names of shell namespace GUIDs in paths and links, from Eric Zimmerman's GuidMapping table
# (about 900 KB).
guid-names = ["shell/guid-names"]
# Code pages other than Windows-1252 (932 Japanese, 936, 949, 950, 1250-1258, ...) for ANSI
# strings in links.
codepages = ["shell/codepages"]

[dependencies]
# Links, shell items and property stores: Yamato Security's ys-lnk-parser, pinned to a commit.
shell = { package = "sootmark-shell", git = "https://github.com/Yamato-Security/ys-lnk-parser", rev = "f069c945f455cd904e6f4d1f21015590af796d5a", version = "0.4", default-features = false }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
